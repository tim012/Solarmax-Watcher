# Settings for the Solarmax Watcher
# defaults are shown in parentheses

## Global settings of the logger

# Debug? (0)
Debug=0

# location of error file
Errorfile=/opt/solarmax/log/solarmax-error.log

# location of logging file
Debugfile=/opt/solarmax/log/solarmax-debug.log

# Interval to read the values of the inverter (60)
Loginterval=120

# Interval between the queries for the averageable values during this
# interval (30). This means that the values will be averaged about
# Loginterval/Logavginterval (4) times during one Loginterval.
Logavginterval=30

## MySQL settings

# Hostname which is running the MySQL server (localhost)
DBhost=localhost

# Name of the MySQL DB for the Solarmax logger (solarmax)
DBname=solarmax

# Tablename
DBtable=log10mt2

# DB user to write the values solarmax-DB (solaruser)
DBuser=solaruser

# Password for the DB user (userpassword)
DBpass=userpassword


## Inverter settings

# IP-address or hostname of the inverter (192.168.178.35)
Hostname=192.168.178.35

# IP-Port of the inverter (12345)
Hostport=12345


## MQTT settings

# Every value read from the inverter (see Logavginterval) is published as
# one topic per value, e.g. solarmax/pac, solarmax/kdy, solarmax/ud01.
# The database still receives the averaged values every Loginterval.

# IP-address or hostname of the MQTT broker (empty). As long as this line
# is missing or commented out, MQTT stays off and nothing is published.
MQTThost=192.168.X.Y

# IP-Port of the MQTT broker (1883)
MQTTport=1883

# User for the broker (empty). Leave commented out for an anonymous broker.
MQTTuser=

# Password for the broker user (empty)
MQTTpass=

# Prefix for all published topics (solarmax)
MQTTtopic=solarmax

# QoS used for publishing, 0, 1 or 2 (0)
MQTTqos=0

# Publish retained, so a subscriber gets the last value immediately
# after connecting, 0 or 1 (1)
MQTTretain=1
